global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "ec2-host"
    static_configs:
      - targets: ["host.docker.internal:9100"]

  - job_name: "emotion-intelligence"
    metrics_path: /metrics
    static_configs:
      - targets: ["172.31.13.34:8000"]